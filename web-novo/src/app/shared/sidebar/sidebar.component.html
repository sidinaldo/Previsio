<div class="pv-menu__logo">
  <a class="pv-logo" routerLink="/pages/painel" aria-label="Previsio, ir para o painel">
    <span class="pv-logo__mini" aria-hidden="true">P</span>
    <span class="pv-logo__texto" aria-hidden="true">
      <span class="pv-logo__nome">Previsio</span>
      <span class="pv-logo__assinatura">by Soft.IO</span>
    </span>
  </a>
</div>

<!-- sidebar-wrapper: o layout liga a barra de rolagem do template nesta classe -->
<nav class="sidebar-wrapper pv-menu__navegacao" aria-label="Menu principal">
  <ul class="pv-menu__lista">
    @for (item of itens(); track item.path) {
      <li>
        <a class="pv-menu__item" [routerLink]="item.path" routerLinkActive="pv-menu__item--ativo"
           ariaCurrentWhenActive="page" [title]="item.title">
          <i class="material-icons" aria-hidden="true">{{ item.icone }}</i>
          <span class="pv-menu__texto">{{ item.title }}</span>
        </a>
      </li>
    }
  </ul>
</nav>

@if (usuario(); as u) {
  <div class="pv-menu__usuario">
    <span class="pv-menu__avatar" aria-hidden="true"><i class="material-icons">person</i></span>
    <div class="pv-menu__dados">
      <span class="pv-menu__nome" [title]="u.email">{{ u.nome }}</span>
      <span class="pv-menu__perfil">{{ descricaoPerfil(u.perfil) }}</span>
    </div>
    <button type="button" class="pv-menu__sair" (click)="sair()" title="Sair">
      <i class="material-icons" aria-hidden="true">logout</i>
      <span>Sair</span>
    </button>
  </div>
}
