<header class="pv-topo">
  <button type="button" class="pv-topo__menu" (click)="alternarMenu()"
          aria-label="Mostrar ou recolher o menu" title="Mostrar ou recolher o menu">
    <i class="material-icons" aria-hidden="true">menu</i>
  </button>

  <div class="pv-topo__direita">
    @if (ehAdmin() && clientes().length > 0) {
      <div class="pv-topo__cliente">
        <label class="pv-rotulo" for="topo-cliente">Cliente</label>
        <!-- bmd-form-group: impede o Bootstrap Material Design de embrulhar o select -->
        <span class="pv-campo-grupo bmd-form-group">
          <select id="topo-cliente" class="pv-campo" [ngModel]="clienteId()" (ngModelChange)="trocarCliente($event)">
            @for (cliente of clientes(); track cliente.id) {
              <option [ngValue]="cliente.id">{{ cliente.nome }}</option>
            }
          </select>
        </span>
      </div>
    }
    @if (usuario(); as u) {
      <span class="pv-topo__usuario" [title]="u.email">{{ u.nome }}</span>
    }
  </div>
</header>
