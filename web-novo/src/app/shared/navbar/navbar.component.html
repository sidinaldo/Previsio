<nav class="navbar navbar-expand-lg navbar-transparent navbar-absolute">
  <div class="container-fluid">
    <div class="navbar-wrapper">
      <div class="navbar-minimize">
        <button type="button" class="btn btn-just-icon btn-white btn-fab btn-round" (click)="minimizarMenu()"
                aria-label="Minimizar menu">
          <i class="material-icons text_align-center visible-on-sidebar-regular">more_vert</i>
          <i class="material-icons design_bullet-list-67 visible-on-sidebar-mini">view_list</i>
        </button>
      </div>
      <span class="navbar-brand">{{ titulo() }}</span>
    </div>

    <button type="button" class="navbar-toggler btn-no-ripple" [class.toggled]="menuCelularAberto()"
            (click)="alternarMenuCelular()" aria-label="Abrir menu">
      <span class="sr-only">Abrir menu</span>
      <span class="navbar-toggler-icon icon-bar"></span>
      <span class="navbar-toggler-icon icon-bar"></span>
      <span class="navbar-toggler-icon icon-bar"></span>
    </button>

    <div class="collapse navbar-collapse justify-content-end">
      @if (ehAdmin() && clientes().length > 0) {
        <div class="navbar-form">
          <div class="input-group no-border">
            <select class="form-control" aria-label="Cliente exibido" title="Cliente exibido"
                    [ngModel]="clienteId()" (ngModelChange)="trocarCliente($event)">
              @for (cliente of clientes(); track cliente.id) {
                <option [ngValue]="cliente.id">{{ cliente.nome }}</option>
              }
            </select>
          </div>
        </div>
      }
      <ul class="navbar-nav">
        @if (usuario(); as u) {
          <li class="nav-item">
            <span class="nav-link" [title]="u.email">{{ u.nome }}</span>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link" href="#" (click)="sair($event)">Sair</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
