<div class="wrapper wrapper-full-page">
  <div class="page-header login-page header-filter" filter-color="black"
       style="background-image: url('assets/img/login.jpg'); background-size: cover; background-position: top center;">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 col-md-6 col-sm-6 ml-auto mr-auto">
          <form class="form" (ngSubmit)="entrar()">
            <div class="card card-login" [class.card-hidden]="!cartaoVisivel()">
              <div class="card-header card-header-rose text-center">
                <h4 class="card-title">Entrar no Previsio</h4>
              </div>
              <div class="card-body">
                <p class="card-description text-center">Use o e-mail e a senha da sua empresa</p>
                <span class="bmd-form-group">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="material-icons">email</i>
                      </span>
                    </div>
                    <input type="email" class="form-control" placeholder="E-mail..." name="email"
                           autocomplete="username" [(ngModel)]="email">
                  </div>
                </span>
                <span class="bmd-form-group">
                  <div class="input-group">
                    <div class="input-group-prepend">
                      <span class="input-group-text">
                        <i class="material-icons">lock_outline</i>
                      </span>
                    </div>
                    <input type="password" class="form-control" placeholder="Senha..." name="senha"
                           autocomplete="current-password" [(ngModel)]="senha">
                  </div>
                </span>
              </div>
              <div class="card-footer justify-content-center">
                <button type="submit" class="btn btn-rose btn-link btn-lg">Entrar</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <footer class="footer">
      <div class="container">
        <div class="copyright pull-right">
          &copy; {{ ano }} Previsio · Soft.IO
        </div>
      </div>
    </footer>
  </div>
</div>
