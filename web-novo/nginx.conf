# Painel do Previsio + repasse da API. Atrás do Cloudflare Tunnel: o HTTPS termina na borda do
# Cloudflare, e aqui chega HTTP pela rede interna dos contêineres.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Upload do certificado A1 (.pfx) e dos arquivos de nota
    client_max_body_size 10m;

    server_tokens off;
    include /etc/nginx/snippets/seguranca.conf;

    # A API. Só /api: o /health e o painel do Hangfire ficam alcançáveis apenas por dentro.
    location /api/ {
        proxy_pass http://previsio-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        # CF-Connecting-IP passa como veio do Cloudflare (a API lê o IP real dele)
        proxy_read_timeout 120s;
    }

    # Arquivos com hash no nome: podem ficar em cache para sempre
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/seguranca.conf;
        try_files $uri =404;
    }

    # O painel usa rotas com hash (/#/pages/...): tudo o mais é o index.html, sem cache,
    # para um deploy novo valer na hora
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/seguranca.conf;
        try_files $uri /index.html;
    }
}
